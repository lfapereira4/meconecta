spring.application.name=meConecta

# RNF: conexao com o PostgreSQL - preencha com as credenciais do seu ambiente
# (nunca faca commit de senhas reais; para producao prefira variaveis de ambiente).
spring.datasource.url=jdbc:postgresql://localhost:5432/meconecta
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Em desenvolvimento, "update" cria/ajusta as tabelas automaticamente a partir das entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# RNF01: horario do sistema sincronizado com o fuso de Brasilia.
spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
