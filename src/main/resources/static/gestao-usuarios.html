<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gestão de Usuários - Me-Conecta</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding: 40px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        h2 { color: #003366; border-bottom: 3px solid #ffcc00; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background-color: #003366; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #ddd; }
        .btn-voltar { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #003366; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <a href="/" class="btn-voltar">← Voltar ao Início</a>
    <h2>Usuários Cadastrados (Alunos e Profissionais)</h2>
    <table id="tabelaUsuarios">
        <thead>
        <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Tipo/Cargo</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    fetch('/usuarios/listar-todos')
        .then(res => res.json())
        .then(dados => {
            const tbody = document.querySelector('#tabelaUsuarios tbody');
            dados.forEach(u => {
                tbody.innerHTML += `<tr>
                    <td>${u.nome}</td>
                    <td>${u.email}</td>
                    <td>${u.tipo || 'Estudante'}</td>
                </tr>`;
            });
        });
</script>
</body>
</html>
