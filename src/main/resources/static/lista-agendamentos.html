<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo - Me-Conecta</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding: 40px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        h2 { color: #003366; border-bottom: 3px solid #ffcc00; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background-color: #003366; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #ddd; }

        /* Destaque de Prioridade */
        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .PRIORIDADE_ALTA { background-color: #ffe5e5; color: #d9534f; border: 1px solid #d9534f; }
        .PENDENTE { background-color: #e5f1ff; color: #0056b3; }
        .CONCLUIDO { background-color: #e5ffe5; color: #28a745; text-decoration: line-through; }

        .btn-atender { background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .btn-voltar { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #003366; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <a href="/" class="btn-voltar">← Voltar ao Painel</a>
    <h2>Gestão de Atendimentos (NUAPE)</h2>
    <table id="tabelaAgendamentos">
        <thead>
        <tr>
            <th>ID</th>
            <th>Relato do Aluno</th>
            <th>Status / Triagem</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
</div>

<script>
    // Função para carregar os dados do Java
    function carregarAgendamentos() {
        fetch('/agendamentos/listar')
            .then(response => response.json())
            .then(dados => {
                const corpoTabela = document.querySelector('#tabelaAgendamentos tbody');
                corpoTabela.innerHTML = '';
                dados.forEach(item => {
                    const linha = `
                        <tr>
                            <td>${item.id}</td>
                            <td>${item.descricaoProblema}</td>
                            <td><span class="status-badge ${item.status}">${item.status}</span></td>
                            <td>
                                ${item.status !== 'CONCLUIDO' ?
                                  `<button class="btn-atender" onclick="atender(${item.id})">Concluir</button>` : '✅'}
                            </td>
                        </tr>`;
                    corpoTabela.innerHTML += linha;
                });
            });
    }

    function atender(id) {
        fetch(`/agendamentos/${id}/concluir`, { method: 'POST' })
            .then(() => carregarAgendamentos()); // Atualiza a lista na hora
    }

    carregarAgendamentos(); // Inicia a busca ao abrir a página
</script>
</body>
</html>
